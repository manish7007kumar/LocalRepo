<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlink</title>
</head>
<body>
    <!-- Absolute path of hyperlink -->
     <a href="https://www.google.com" target="_blank">Google</a>
    <br>
    <br>
    <!-- How to connect google map -->
     <a href="https://maps.app.goo.gl/6uC3TNaTRdCsuj5S7"> Kashi Vishwanath Temple</a> 

     <!-- How to use with anchor tag with address tag -->
    <br>
    <br>
     <address>
        <a href="https://maps.app.goo.gl/xdcxAK5Gu5JM2KU78  " target="_blank"></a>
        BLW jalaipatti Bullanpur PAC varanasi,<br>
        Uttar Pradesh.
     </address>
     <br>
     <!--  How to make image as a link -->
       <a href="https://youtu.be/V5HHn_WjpJE?si=wkkxMcvW_QWmlBaW">
        <img src="https://i.redd.it/msws1zh0empb1.jpg" alt="Image of Naredra modi and Georgia"  
        height="330px" 
        width="400px" 
        title="Thukra k mera pyar" 
        loading="lazy">

       </a>

       <!-- How to connect playlist -->
       <figure>
       <a href="https://wynk.in/music/package/hindi-top-50/bb_1576765366052">
     
            <img src="playlistSong.jpg"
        alt="PlayList song"
        height="260px"
        width="360px"
        title="playlist"
        loading="lazy">
       </a>
       <figcaption> Music playlist</figcaption>
    </figure>
</body>
</html>
