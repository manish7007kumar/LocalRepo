<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        sup{
            color: red;
        }
    </style>
</head>
<body>
    <form action="#" autocomplete="off">
        <!-- Name : <input type="text" name="User_name" value="Alex" disabled><br><br> -->
        Name : <input type="text" name="User_name" placeholder="Enter your name" autofocus size="16" minlength="2" maxlength="16"><br><br>
        <!-- Mobile:<input type="tel" name="mobile_number" value="+91********" readonly><br><br> -->
        Mobile:<input type="tel" name="mobile_number" placeholder="Enter your number" minlength="10" maxlength="10"><br><br>
        Email<sup>*</sup>: <input type="email" name="user_email" placeholder="xyz@gmail.com" required><br><br>
        Password<sup>*</sup> :<input type="password" placeholder="Atleast 8 character" required><br><br>
 
        caculate 10*2 :
        <input type="number" min="0" max="100" step="10"> <br><br>

        Select salary range 
        <input type="range" min="0" max="100" step="20" value="0"> <br><br>
        Submit your resume:<br>
        <input type="file" accept=".pdf"><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Cancel">
    </form>
</body>
</html>
